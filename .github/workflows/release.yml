name: Release

on:
  push:
    branches:
      - main
    # le site, la doc et les specs ne sont pas du code : pas de release pour eux
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'specs/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use newest installed Xcode (Swift 6 toolchain)
        run: |
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          swift --version

      - name: Build
        run: swift build

      # Calcule la version sans rien tagger : le tag naît avec la release, une fois
      # le DMG construit. Un build cassé ne peut donc plus laisser de tag orphelin.
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # push sur main : bump automatique du patch depuis le dernier tag
            LAST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
            LAST="${LAST#v}"
            LAST="${LAST:-0.0.0}"
            MAJOR="${LAST%%.*}"
            REST="${LAST#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            V="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build app + DMG
        run: bash scripts/package.sh "${{ steps.v.outputs.version }}"

      # Le flux Sparkle est attaché à chaque release (main est protégée : la CI
      # n'y pousse rien). On repart de celui de la dernière release pour garder
      # l'historique ; à la toute première, il n'existe pas encore.
      - name: Build appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release download --pattern appcast.xml --dir dist || true
          python3 scripts/appcast.py "$V" "dist/Snappy-$V.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          DMG="dist/Snappy-$V.dmg"
          # le ZIP est l'artefact que Sparkle télécharge pour mettre à jour
          # une app déjà installée ; le DMG reste la première installation
          ZIP="dist/Snappy-$V.zip"
          FEED="dist/appcast.xml"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$DMG" "$ZIP" "$FEED" --clobber
          else
            gh release create "v$V" --title "Snappy $V" --target "$GITHUB_SHA" --latest \
              --notes "Automated release. Open the DMG and drag Snappy into Applications. Snappy is ad-hoc signed (not notarized): on first launch, open System Settings › Privacy & Security and click Open Anyway (on macOS 14, right-click Snappy.app › Open), then allow Screen Recording. Requires macOS 14+." \
              "$DMG" "$ZIP" "$FEED"
          fi
